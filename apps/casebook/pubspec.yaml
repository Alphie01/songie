name: casebook
description: "Casebook — ekipçe çözülen polisiye vakalar"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  songie_core:
    path: ../../packages/songie_core
  firebase_core: ">=4.1.0 <4.14.0"
  # songie_core ile aynı sürümler (ana ekran oturumu ve yönlendiriciyi kullanır).
  provider: ^6.1.5+1
  go_router: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Testler ve ikon çizimi için (uygulama bunları songie_core üzerinden kullanır).
  http: ^1.6.0
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  fonts:
    - family: Baloo2
      fonts:
        - asset: packages/songie_core/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: packages/songie_core/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: packages/songie_core/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: packages/songie_core/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: packages/songie_core/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: packages/songie_core/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: packages/songie_core/fonts/Nunito-ExtraBold.ttf
          weight: 800
    # Dedektif belgeleri (games/detective: DtFont).
    - family: Tinos
      fonts:
        - asset: packages/songie_core/fonts/detective/Tinos-Regular.ttf
        - asset: packages/songie_core/fonts/detective/Tinos-Italic.ttf
          style: italic
        - asset: packages/songie_core/fonts/detective/Tinos-Bold.ttf
          weight: 700
        - asset: packages/songie_core/fonts/detective/Tinos-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Arimo
      fonts:
        - asset: packages/songie_core/fonts/detective/Arimo-Regular.ttf
        - asset: packages/songie_core/fonts/detective/Arimo-Italic.ttf
          style: italic
        - asset: packages/songie_core/fonts/detective/Arimo-Bold.ttf
          weight: 700
        - asset: packages/songie_core/fonts/detective/Arimo-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Cousine
      fonts:
        - asset: packages/songie_core/fonts/detective/Cousine-Regular.ttf
        - asset: packages/songie_core/fonts/detective/Cousine-Italic.ttf
          style: italic
        - asset: packages/songie_core/fonts/detective/Cousine-Bold.ttf
          weight: 700
        - asset: packages/songie_core/fonts/detective/Cousine-BoldItalic.ttf
          weight: 700
          style: italic
    - family: ComicNeue
      fonts:
        - asset: packages/songie_core/fonts/detective/ComicNeue-Regular.ttf
        - asset: packages/songie_core/fonts/detective/ComicNeue-Italic.ttf
          style: italic
        - asset: packages/songie_core/fonts/detective/ComicNeue-Bold.ttf
          weight: 700
        - asset: packages/songie_core/fonts/detective/ComicNeue-BoldItalic.ttf
          weight: 700
          style: italic
    # Casebook ana ekranı (OFL: assets/fonts/OFL.txt).
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
          weight: 400
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700

# Uygulama ikonu (assets/icon: packages/songie_core/tool/render_app_icons_test.dart ile dört uygulama birlikte üretilir). Üret: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#14102A"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 23

# Açılış ekranı: koyu zemin + dosya rozeti. Üret: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#14102A"
  image: assets/icon/splash.png
  android_12:
    color: "#14102A"
    image: assets/icon/foreground.png
