name: songie
description: "Songie — arkadaşlarla oyun gecesi"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  socket_io_client: ^3.1.6
  http: ^1.6.0
  provider: ^6.1.5+1
  go_router: ^17.2.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.4
  firebase_core: ">=4.1.0 <4.14.0"
  firebase_auth: ">=6.2.0 <6.3.0"
  google_sign_in: ^7.2.0
  just_audio: ^0.10.6
  flutter_svg: ^2.3.0
  share_plus: ^12.0.2
  app_links: ^6.4.1
  package_info_plus: ^9.0.1
  unorm_dart: ^0.3.3
  audio_session: ^0.2.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/catalog.json

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    # Dedektif Masası belge fontları (web'deki sistem font yığınlarının Google Fonts karşılıkları)
    - family: Tinos
      fonts:
        - asset: assets/fonts/detective/Tinos-Regular.ttf
        - asset: assets/fonts/detective/Tinos-Italic.ttf
          style: italic
        - asset: assets/fonts/detective/Tinos-Bold.ttf
          weight: 700
        - asset: assets/fonts/detective/Tinos-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Arimo
      fonts:
        - asset: assets/fonts/detective/Arimo-Regular.ttf
        - asset: assets/fonts/detective/Arimo-Italic.ttf
          style: italic
        - asset: assets/fonts/detective/Arimo-Bold.ttf
          weight: 700
        - asset: assets/fonts/detective/Arimo-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Cousine
      fonts:
        - asset: assets/fonts/detective/Cousine-Regular.ttf
        - asset: assets/fonts/detective/Cousine-Italic.ttf
          style: italic
        - asset: assets/fonts/detective/Cousine-Bold.ttf
          weight: 700
        - asset: assets/fonts/detective/Cousine-BoldItalic.ttf
          weight: 700
          style: italic
    - family: ComicNeue
      fonts:
        - asset: assets/fonts/detective/ComicNeue-Regular.ttf
        - asset: assets/fonts/detective/ComicNeue-Italic.ttf
          style: italic
        - asset: assets/fonts/detective/ComicNeue-Bold.ttf
          weight: 700
        - asset: assets/fonts/detective/ComicNeue-BoldItalic.ttf
          weight: 700
          style: italic

# Uygulama ikonu (assets/icon: tool/render_icon_test.dart ile üretilir). Üret: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2A1B6E"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 23

# Açılış ekranı: mor zemin + logo rozeti. Üret: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#2A1B6E"
  image: assets/icon/splash.png
  android_12:
    color: "#2A1B6E"
    image: assets/icon/foreground.png
